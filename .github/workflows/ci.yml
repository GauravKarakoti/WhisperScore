name: Midnight dApp CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Install Midnight Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh

          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update Compact Toolchain
        # This command downloads the actual compiler binaries
        run: compact update

      - name: Compile Compact Contract
        # This will now successfully find 'compact compile'
        run: npm run compile

      - name: Run Tests
        run: npm test